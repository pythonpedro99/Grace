[project]
name = "gaf"
version = "0.1.0"
description = "Gain attribution with floor check: leak-free predictive training with a shared encoder and SIGReg"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "pandas", "matplotlib", "tqdm", "ipywidgets"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["gaf"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N803", "N806", "N812"]  # capitalised tensors (D, T, N, P, Q, L) follow the one-pager
